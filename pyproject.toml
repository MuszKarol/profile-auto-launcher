[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-auto-launcher"
version = "1.0.0"
description = "Launch a whole working context — apps, tabs and services — from one window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["launcher", "automation", "workflow", "productivity", "profiles", "rsync"]
authors = [{ name = "Karol Musz" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/MuszKarol/profile-auto-launcher"
Documentation = "https://github.com/MuszKarol/profile-auto-launcher/blob/main/docs/REFERENCE.md"
Changelog = "https://github.com/MuszKarol/profile-auto-launcher/blob/main/CHANGELOG.md"
Issues = "https://github.com/MuszKarol/profile-auto-launcher/issues"

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10.0"]
hotkey = ["pynput>=1.7"]
secrets = ["keyring>=24.0"]
probe = ["psutil>=5.9"]           # faster/uniform process, wifi and battery probes
full = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "pynput>=1.7",
    "keyring>=24.0",
    "psutil>=5.9",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
palaunch = "launcher.cli:main"

[project.gui-scripts]
palaunchw = "launcher.cli:main"
palaunch-setup = "launcher.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
launcher = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:launcher.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are handled by the formatter, not the linter
    "B008",    # dataclass fields legitimately call default factories
    "SIM105",  # contextlib.suppress is not clearer for the best-effort writes
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose — that is where the edge cases are.
"tests/*" = ["E402"]
