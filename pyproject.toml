[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-auto-launcher"
version = "0.1.0"
description = "Cross-platform workflow automation launcher with context profiles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10.0"]
hotkey = ["pynput>=1.7"]
full = ["pystray>=0.19", "Pillow>=10.0", "pynput>=1.7"]

[project.scripts]
palaunch = "launcher.cli:main"

[project.gui-scripts]
palaunchw = "launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
