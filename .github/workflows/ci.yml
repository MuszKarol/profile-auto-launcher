name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        include:
          # The launcher is mostly platform-specific glue, so the newest
          # Python gets one extra run on every OS rather than a full matrix.
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q --junitxml=results.xml

      - name: Smoke-test the CLI
        shell: bash
        run: |
          palaunch --help
          palaunch where
          palaunch schema --stdout > /dev/null
          palaunch new "CI Check"
          palaunch validate
          palaunch run "CI Check" --dry-run

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  sample-profiles:
    name: Sample profiles are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate the shipped profiles
        env:
          PAL_INCLUDE_CWD: "1"
        run: palaunch validate
