name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never touch a runner's real user config, and keep `palaunch validate`
  # looking at the profiles this job created rather than at leftovers.
  PAL_CONFIG_DIR: ${{ github.workspace }}/.pal-ci

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        include:
          # The launcher is mostly platform-specific glue, so the newest
          # Python gets one extra run on every OS rather than a full matrix.
          - os: ubuntu-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The HUD, profile editor and settings panel are Tk windows, and their
      # tests skip themselves when no display can be opened. Xvfb is what makes
      # them actually run on Linux instead of quietly passing.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Importing tkinter is not enough: the Windows runners ship a Python
      # whose Tcl/Tk data files are missing, so the import succeeds and every
      # window still fails. Opening one is the only honest check.
      - name: Report GUI test coverage
        shell: bash
        run: |
          probe='import tkinter; tkinter.Tk().destroy()'
          if [ "${{ runner.os }}" = "Linux" ]; then
            probe_cmd="xvfb-run -a python -c"
          else
            probe_cmd="python -c"
          fi
          if $probe_cmd "$probe" 2>/dev/null; then
            echo "Tk works here — the GUI tests will run."
          else
            echo "::warning::Tk cannot open a window on this runner; the GUI tests will skip."
          fi

      - name: Test
        if: runner.os != 'Linux'
        run: python -m pytest -q --junitxml=results.xml

      - name: Test (under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --junitxml=results.xml

      - name: Smoke-test the CLI
        shell: bash
        run: |
          palaunch --help
          palaunch settings --help
          palaunch where
          palaunch schema --stdout > /dev/null
          palaunch new "CI Check"
          palaunch validate
          palaunch run "CI Check" --dry-run
          palaunch config list
          palaunch config set theme dark
          test "$(palaunch config get theme)" = "dark"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python }}
          path: results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  sample-profiles:
    name: Sample profiles are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate the shipped profiles
        env:
          PAL_INCLUDE_CWD: "1"
        run: palaunch validate

  package:
    name: Package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      # Catches the metadata problems that only surface at upload time, when
      # the tag is already pushed and the release is half-done.
      - run: python -m twine check dist/*
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/palaunch --help > /dev/null
          /tmp/fresh/bin/palaunch where
