# "Dev Mode" — full development environment
# Fields written as {windows, linux, darwin} are picked per-platform at runtime.
name: Dev
description: Spin up the full dev environment (Docker, IDE, repos, dashboards)
tags: [code, ide, docker]
default: true
hotkey: "<ctrl>+<alt>+d"

# {{ vars.NAME }} works in any string below — one place to change the repo path
vars:
  repo: "~/projects/main"

steps:
  # ── 1. Set environment for anything we launch below
  - type: env
    name: dev env vars
    set:
      ENVIRONMENT: development
      PAL_SESSION: dev
      REPO_ROOT: "{{ vars.repo }}"
    unset:
      - HTTP_PROXY

  # ── 2. Kill distracting apps
  - type: kill
    name: close Slack
    process:
      windows: slack.exe
      linux: slack
      darwin: Slack

  # ── 3. Start Docker (long-running, detached) then wait for it to be ready
  - type: command
    id: docker
    name: start docker
    detach: true
    run:
      windows: ["powershell", "-NoProfile", "-Command", "Start-Process 'Docker Desktop'"]
      linux: ["systemctl", "--user", "start", "docker-desktop"]
      darwin: ["open", "-a", "Docker"]

  # Poll `docker info` until the daemon actually answers (better than a blind sleep)
  - type: wait_for
    id: docker-ready
    name: docker ready
    run: ["docker", "info"]
    timeout: 60
    interval: 2
    optional: true # don't fail the profile on machines without docker

  # Only starts once docker-ready succeeded; if it didn't, this is skipped
  # rather than failing against a daemon that isn't there.
  - type: command
    name: bring up services
    depends_on: [docker-ready]
    detach: false
    timeout: 120
    retries: 1
    retry_delay: 3
    cwd: "{{ vars.repo }}"
    run: ["docker", "compose", "up", "-d"]
    optional: true

  # ── 4. Launch IDE + terminal in parallel, each placed on its own half
  - type: app
    name: VS Code
    parallel: true
    path:
      windows: "%LOCALAPPDATA%\\Programs\\Microsoft VS Code\\Code.exe"
      linux: /usr/bin/code
      darwin: /Applications/Visual Studio Code.app/Contents/MacOS/Electron
    args:
      - "{{ vars.repo }}"
    window:
      monitor: 1
      position: left-half

  - type: app
    name: Terminal
    parallel: true
    path:
      windows: wt.exe
      linux: /usr/bin/gnome-terminal
      darwin: /System/Applications/Utilities/Terminal.app/Contents/MacOS/Terminal
    window:
      monitor: 1
      position: right-half

  # ── 5. Open the usual browser tabs (sequential, default)
  - type: url
    name: GitHub PRs
    url: https://github.com/pulls/review-requested

  - type: url
    name: Linear
    url: https://linear.app/inbox

  - type: url
    name: local dashboard
    url: http://localhost:3000

  # ── 6. Inline script — multi-line shell without escaping it into argv
  - type: script
    name: sync the repo
    shell: bash
    cwd: "{{ vars.repo }}"
    optional: true
    when:
      platform: [linux, darwin]
      exists: "{{ vars.repo }}/.git"
    script: |
      git fetch --all --prune
      git pull --ff-only || echo "branch has diverged — leaving it alone"

  - type: notify
    name: ready
    title: Dev
    message: "Environment up at {{ time }}"

# `palaunch stop Dev` runs these, then closes every process the profile started
teardown:
  - type: command
    name: stop services
    detach: false
    timeout: 60
    cwd: "{{ vars.repo }}"
    run: ["docker", "compose", "down"]
    optional: true
